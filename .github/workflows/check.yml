name: Entropy M1

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned MoonBit toolchain
        env:
          MOONBIT_INSTALL_VERSION: '0.10.20+65efd5b93'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          bash /tmp/install-moonbit.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Prepare native core
        run: |
          moon version --all
          moon -C "$HOME/.moon/lib/core" bundle --target native --warn-list -a
      - run: npm ci --ignore-scripts
      - run: moon fmt --check
      - run: moon check --target native --deny-warn
      - run: npm test
      - run: npm run test:wasm
