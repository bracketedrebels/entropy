# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  storybook:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: design-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design-system/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: trinet-storybook
          path: design-system/storybook-static
          if-no-files-found: error

  gh-pages:
    needs: storybook
    runs-on: ubuntu-latest
    steps:
      - name: checking out codebase
        uses: actions/checkout@v2
        
      - name: dependencies installation
        run: npm i

      - name: building production bundle
        run: npm run build-prod
      
      - name: include the component catalog in Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/download-artifact@v4
        with:
          name: trinet-storybook
          path: dist/storybook

      - name: deploying to github pages
        if: github.ref == 'refs/heads/master'
        uses: crazy-max/ghaction-github-pages@v2.2.0
        with:
          build_dir: dist
          target_branch: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
