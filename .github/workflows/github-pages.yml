name: Graph editor
on:
  push:
    branches: [master]
    paths: &graph-paths
      - 'src/**'
      - 'static/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '*.config.*'
  pull_request:
    branches: [master]
    paths: *graph-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i
      - run: npm run build-prod
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master'
        with:
          name: graph-editor
          path: dist
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    concurrency: entropy-pages-publish
    environment: github-pages
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - uses: actions/download-artifact@v4
        with:
          name: graph-editor
          path: graph
      - name: Update the editor and preserve the sibling catalog
        run: |
          rsync -a --delete --exclude=/.git/ --exclude=/storybook/ --exclude=/CNAME --exclude=/.nojekyll graph/ published/
          cd published
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Publish editor for ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: published
      - uses: actions/deploy-pages@v4
