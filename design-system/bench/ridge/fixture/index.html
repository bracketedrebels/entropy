<!doctype html><html lang="ru"><meta charset="utf-8"><title>Окно виртуализации</title>
<script>
// Only the document-wide registration observer is timed. Both modes retain local layout observers.
window.discovery = { time: 0, records: 0, observers: 0 }
const NativeObserver = window.MutationObserver
window.MutationObserver = class extends NativeObserver {
  constructor(callback) {
    super((records, observer) => {
      if (!this.global) return callback(records, observer)
      const start = performance.now()
      try { callback(records, observer) }
      finally {
        window.discovery.time += performance.now() - start
        window.discovery.records += records.length
      }
    })
  }
  observe(node, options) {
    if (node === document && options.subtree && options.childList) {
      this.global = true
      window.discovery.observers++
    }
    return super.observe(node, options)
  }
}
</script>
